[project]
name = "taller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lmesac", email = "lida.mesa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
taller = "taller:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
